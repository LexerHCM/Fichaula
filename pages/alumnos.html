<!DOCTYPE html>
<html lang="es">
<head>
  <title>Alumnos — Fichaula</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <header></header>

  <main>

    <section class="page-header">
      <div class="page-header-inner">
        <a href="../index.html" class="back-btn">← Volver al inicio</a>
        <div class="badge">GESTIÓN DE ALUMNOS</div>
        <h1 class="page-title">Mis <span>Alumnos</span></h1>
        <p class="page-subtitle" id="page-subtitle">Listado de alumnos de tus cursos</p>
      </div>
    </section>

    <section class="alumnos-section">
      <div class="alumnos-toolbar">
        <div class="alumnos-count-label" id="count-label"></div>
        <div class="search-input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-input" class="search-input"
                 placeholder="Buscar por nombre o curso...">
        </div>
      </div>

      <div class="alumnos-table-wrapper">
        <table class="alumnos-table">
          <thead>
            <tr id="thead-row"></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

  </main>

  <footer></footer>

  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/alumnos.js"></script>

</body>
</html>
