<!DOCTYPE html>
<html lang="es">
<head>
  <title>Curso — Fichaula</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <header></header>

  <main>

    <section class="page-header">
      <div class="page-header-inner">
        <button class="back-btn" id="btn-back-top">← Volver a clases</button>
        <div id="curso-header"></div>
      </div>
    </section>

    <section class="alumnos-section">
      <div class="alumnos-toolbar">
        <div class="alumnos-count-label" id="alumnos-count-label"></div>
        <div class="search-input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Buscar alumno...">
        </div>
      </div>

      <div class="alumnos-table-wrapper">
        <table class="alumnos-table">
          <thead><tr id="thead-row"></tr></thead>
          <tbody id="alumnos-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Sección de seguimientos -->
    <section class="seguimientos-section" id="seguimientos-section" style="display:none;">
      <div class="seguimientos-header">
        <h2 class="seguimientos-title">Seguimiento de <span>alumnos</span></h2>
        <span class="seguimientos-hint" id="seguimientos-hint">Temporales — se pierden al recargar</span>
      </div>

      <!-- Form (solo profe) -->
      <div class="seg-form" id="seg-form-wrapper">
        <div class="seg-form-row">
          <select id="seg-alumno" class="seg-select">
            <option value="">Seleccioná un alumno...</option>
          </select>
          <select id="seg-categoria" class="seg-select">
            <option value="">Categoría...</option>
            <option value="conducta">Conducta</option>
            <option value="actitud">Actitud</option>
            <option value="nota">Nota</option>
            <option value="observacion">Observación</option>
          </select>
          <input type="number" id="seg-valor" class="seg-numero"
                 placeholder="Nota" min="0" max="10" step="0.1" disabled>
          <input type="text" id="seg-texto" class="seg-input"
                 placeholder="Escribí el seguimiento..." maxlength="280">
          <button class="btn-seg" id="btn-agregar-seg">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Agregar
          </button>
        </div>
      </div>

      <div class="seguimientos-list" id="seguimientos-list"></div>

      <div style="margin-top:40px; display:flex; gap:12px; flex-wrap:wrap;">
        <button class="btn-primary" id="btn-back-bottom">← Volver a clases</button>
        <a href="../index.html" class="btn-secondary">Ir al inicio</a>
      </div>
    </section>

  </main>

  <footer></footer>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-logic.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/curso.js"></script>

</body>
</html>
